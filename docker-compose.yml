services:
  autosync:
    build:
      context: .
      args:
        PYTHON_IMAGE: ${PYTHON_IMAGE:-python:3.12-slim}
        DEBIAN_MIRROR: ${DEBIAN_MIRROR:-https://mirrors.aliyun.com}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.tuna.tsinghua.edu.cn/simple}
    container_name: overleaf-autosync
    restart: unless-stopped
    environment:
      CONFIG_PATH: /app/config.yml
      OVERLEAF_EMAIL: ${OVERLEAF_EMAIL:-}
      OVERLEAF_PASSWORD: ${OVERLEAF_PASSWORD:-}
      TZ: ${TZ:-Asia/Shanghai}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - ${SYNC_DIR:-./backup}:/backup
      - ${STATE_DIR:-./state}:/state
      - ${CONFIG_FILE:-./config.example.yml}:/app/config.yml:ro
    ports:
      - "${WEB_PORT:-30389}:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
