overleaf:
  # 如果 AutoSync 与 Overleaf 在同一台 Linux 主机，推荐使用下面这个地址。
  # docker-compose.yml 已配置 host-gateway。
  base_url: "http://host.docker.internal:30388"
  email_env: "OVERLEAF_EMAIL"
  password_env: "OVERLEAF_PASSWORD"
  verify_tls: false
  timeout: 60

sync:
  # 每次周期都会先重新发现账号下的项目，再同步已启用的项目。
  interval_seconds: 300
  destination: "/backup"
  # Web 面板中的备份开关保存在这里。
  state_path: "/state/selection.json"
  sync_on_start: true
  git:
    enabled: true
    user_name: "Overleaf AutoSync"
    user_email: "autosync@local"

# 不需要填写 Project ID。
# 启动后访问 Web 面板，程序会自动列出该账号可访问的全部项目，
# 在页面上勾选需要备份的项目即可。
